<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja Rampage 64</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 12px 35px;background:#100b20;color:#f9e7c0;font-family:monospace;text-align:center}h1{margin:10px 0;color:#ff644e;letter-spacing:5px;text-shadow:3px 3px #671b42;font-size:clamp(24px,5vw,42px)}.subtitle{color:#e7b16c;letter-spacing:3px}canvas{display:block;width:100%;max-width:800px;aspect-ratio:16/9;margin:auto;border:4px solid #9570a1;box-shadow:0 0 0 4px #2d203b,0 12px 40px #0009;image-rendering:pixelated;background:#17102e}.hud{display:flex;justify-content:space-between;gap:12px;max-width:800px;margin:16px auto;color:#f6dca5;font-weight:bold}.bar{height:12px;background:#322236;width:clamp(100px,22vw,180px);border:2px solid #9d7384}.fill{height:100%;background:#e64a50}.enemy{background:#d39b4f}#status{color:#ffd178;min-height:1em;letter-spacing:2px}button{background:#392546;color:#fff1cc;border:2px solid #a77d9e;padding:12px 15px;margin:4px;font: bold 14px monospace;cursor:pointer;touch-action:none;box-shadow:3px 3px #1d1226}button:hover,button:active{background:#a23d4d}#controls{max-width:800px;margin:auto}.help{color:#bc9eb6;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<h1>NINJA RAMPAGE 64</h1><p class="subtitle" id="stageName">STAGE 01 — SHADOW VILLAGE</p>
<div class="hud"><div>PLAYER HP<div class="bar"><div id="hp" class="fill" style="width:100%"></div></div></div><div>ENEMIES<div class="bar"><div id="ehp" class="fill enemy" style="width:100%"></div></div></div></div>
<canvas id="game" width="640" height="360"></canvas>
<div class="hud"><span>SCORE: <b id="score">0</b></span><span>STAGE KILLS: <b id="kills">0</b>/<b id="total">5</b></span></div>
<p id="status">READY TO FIGHT</p>
<div id="controls"><button id="left">◀</button><button id="right">▶</button><button id="jump">HYPPY</button><button id="punch">👊 LYÖNTI</button><button id="kick">⚡ POTKU</button><button id="star">✦ TÄHTI</button><button id="door">↓ OVI</button><br><button id="restart">RESTART</button><button id="music">♫ MUSIC ON/OFF</button></div>
<p class="help">WASD TAI NUOLINÄPPÄIMET = LIIKU / HYPPY (↑ TAI W)<br>VÄLILYÖNTI = HYPPY | J = LYÖNTI | L = POTKU | K = TÄHTI<br>VOITA KAIKKI VIHOLLISET, MENE OVELLE JA PAINA S / ↓</p>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=640,H=360,keys={left:false,right:false},stages=[{name:'SHADOW VILLAGE',count:5,hp:3,platforms:[[95,235,115],[285,190,115],[465,225,100]]},{name:'MOONLIT FOREST',count:4,hp:4,platforms:[[45,225,125],[240,175,120],[440,215,145]]},{name:'FROSTFALL KEEP',count:3,hp:5,platforms:[[105,220,110],[265,155,115],[435,210,120]]},{name:'DEMON PEAK',count:2,hp:7,platforms:[[35,225,105],[190,175,100],[350,125,105],[505,205,100]]}];
let player,enemies,stars,particles,score,kills,active,frame,stageIndex,platforms,stageKills,hazards,doorOpen,audio=null,musicOn=false,musicTimer=0;
function loadStage(index){stageIndex=index;const stage=stages[index];platforms=stage.platforms;hazards=[[190,235],[380,425]];stageKills=0;doorOpen=false;enemies=Array.from({length:stage.count},(_,i)=>({x:540+i*25,y:280,vy:0,hp:stage.hp,maxHp:stage.hp,dead:false,attack:0,windup:0,stun:0,flash:0,delay:i*150,jumpIn:50+i*18,spikeCooldown:0}));player.x=65;player.y=280;player.vy=0;player.ground=true;player.starCooldown=0;player.inv=60;if(index>0)player.hp=Math.min(100,player.hp+25);stars=[];document.getElementById('stageName').textContent=`STAGE ${String(index+1).padStart(2,'0')} — ${stage.name}`;document.getElementById('total').textContent=stage.count;document.getElementById('status').textContent=`STAGE ${index+1} — ${stage.name}`;updateHUD()}
function reset(){player={x:65,y:280,vy:0,hp:100,face:1,ground:true,inv:0,move:0,attack:0,kind:''};particles=[];score=0;kills=0;stageIndex=0;frame=0;musicTimer=0;active=true;keys.left=keys.right=false;loadStage(0)}
function updateHUD(){document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';let remaining=enemies?enemies.filter(e=>!e.dead).reduce((sum,e)=>sum+e.hp/e.maxHp,0):0;document.getElementById('ehp').style.width=(remaining/stages[stageIndex].count*100)+'%';document.getElementById('score').textContent=score;document.getElementById('kills').textContent=stageKills||0}
function beep(freq,duration=.1){if(!musicOn)return;try{audio=audio||new AudioContext();let osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
function toggleMusic(){musicOn=!musicOn;if(musicOn){audio=audio||new AudioContext();audio.resume()}}
function jump(){if(active&&player.ground){player.vy=-9;player.ground=false;beep(300)}}
function burst(x,y,color){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,life:15+Math.random()*10,color})}
function damage(e,amount,knock){if(e.dead||e.delay>0)return;e.hp-=amount;e.x=Math.max(15,Math.min(625,e.x+knock));e.flash=10;e.stun=18;e.windup=0;burst(e.x,e.y-35,'#ffe198');if(e.hp<=0){e.dead=true;kills++;stageKills++;score+=250;beep(600);if(stageKills>=stages[stageIndex].count){doorOpen=true;document.getElementById('status').textContent='STAGE CLEARED! FIND THE GLOWING DOOR — PRESS ↓';}}updateHUD()}
function enterDoor(){if(!active||!doorOpen||player.x<545)return;if(stageIndex<stages.length-1)loadStage(stageIndex+1);else finish(true)}
function attack(kind){if(!active||player.attack>0)return;player.kind=kind;player.attack=kind==='kick'?22:14;beep(kind==='kick'?110:170);let range=kind==='kick'?66:48;enemies.forEach(e=>{let dx=(e.x-player.x)*player.face;if(!e.dead&&e.delay<=0&&dx>=-5&&dx<range&&Math.abs(e.y-player.y)<45)damage(e,1,player.face*(kind==='kick'?30:15))})}
function star(){if(!active||player.starCooldown>0)return;player.starCooldown=32;stars.push({x:player.x+player.face*12,y:player.y-26,v:player.face*6});beep(800)}
function hurt(){if(player.inv>0||!active)return;player.hp=Math.max(0,player.hp-10);player.inv=65;player.x=Math.max(12,Math.min(628,player.x-player.face*18));burst(player.x,player.y-25,'#ff6d78');beep(80);updateHUD();if(player.hp<=0)finish(false)}
function finish(win){active=false;document.getElementById('status').textContent=win?'VICTORY! YOU ARE THE NINJA MASTER!':'GAME OVER'}
function update(){frame++;let p=player,oldY=p.y;p.move=0;if(keys.left){p.x-=3;p.face=-1;p.move=1}if(keys.right){p.x+=3;p.face=1;p.move=1}p.x=Math.max(12,Math.min(628,p.x));p.vy+=.42;p.y+=p.vy;p.ground=false;if(p.y>=280){p.y=280;p.vy=0;p.ground=true}for(const [x,y,w] of platforms){if(p.vy>=0&&oldY<=y&&p.y>=y&&p.x+10>x&&p.x-10<x+w){p.y=y;p.vy=0;p.ground=true}}if(p.inv>0)p.inv--;if(p.attack>0)p.attack--;if(p.starCooldown>0)p.starCooldown--;if(p.ground&&player.inv<=0&&hazards.some(([x,r])=>p.x+8>x&&p.x-8<r)){p.hp=Math.max(1,p.hp-8);p.inv=50;burst(p.x,p.y-15,'#ff785d');updateHUD()}if(doorOpen&&p.x>545&&p.ground)document.getElementById('status').textContent='DOOR OPEN — PRESS S OR ↓ TO ENTER';
enemies.forEach(e=>{if(e.dead)return;if(e.delay>0){e.delay--;return}let dx=p.x-e.x;e.jumpIn--;if(e.jumpIn<=0&&Math.abs(dx)>60&&e.y>=280){e.vy=-7.5;e.jumpIn=90+Math.random()*50}e.vy+=.4;e.y+=e.vy;if(e.y>=280){e.y=280;e.vy=0}if(e.spikeCooldown>0)e.spikeCooldown--;if(e.y===280&&e.spikeCooldown<=0&&hazards.some(([x,r])=>e.x+8>x&&e.x-8<r)){e.spikeCooldown=75;damage(e,1,Math.sign(e.x-p.x)*8);if(e.dead)return}if(e.flash>0)e.flash--;if(e.attack>0)e.attack--;if(e.stun>0){e.stun--;return}if(e.windup>0){e.windup--;if(e.windup===0){if(Math.abs(p.x-e.x)<35&&Math.abs(p.y-e.y)<40)hurt();e.attack=75}return}if(Math.abs(dx)>28)e.x+=Math.sign(dx)*1.8;else if(e.attack<=0&&Math.abs(p.y-e.y)<35)e.windup=22});
stars.forEach(s=>{s.x+=s.v;for(const e of enemies){if(!e.dead&&e.delay<=0&&Math.abs(s.x-e.x)<18&&Math.abs(s.y-(e.y-26))<25){damage(e,1,Math.sign(s.v)*15);s.x=1000;break}}});stars=stars.filter(s=>s.x>-10&&s.x<650);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);
if(musicOn&&frame-musicTimer>15){const notes=[262,330,392,523,392,330,294,349];beep(notes[Math.floor(frame/15)%notes.length],.12);musicTimer=frame}}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function softRect(x,y,w,h,color,r=5){x=Math.round(x);y=Math.round(y);ctx.fillStyle=color;ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r)}else{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.lineTo(x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.lineTo(x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.lineTo(x,y+h-r);ctx.lineTo(x,y+r);ctx.closePath()}ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fill()}
function temple(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(0,0,100,80,'#30213c');rect(8,8,84,72,'#523047');rect(14,15,72,65,'#382339');for(let i=0;i<4;i++){rect(17+i*19,20,10,14,'#e89857');rect(19+i*19,22,6,10,'#ffd288')}rect(44,45,17,35,'#19172c');rect(-5,-5,110,8,'#251a35');poly([[-12,-6],[0,-17],[100,-17],[112,-6]],'#7b3448');rect(-5,-17,110,3,'#d26a59');rect(18,-40,64,23,'#39233d');rect(25,-35,50,18,'#67404b');poly([[8,-40],[20,-51],[80,-51],[92,-40]],'#843b4b');rect(14,-51,72,3,'#d67862');rect(45,-64,10,13,'#a85b57');ctx.restore()}
function ninja(x,y,color,face,isPlayer,flash,walking,kind,attackTime){if(isPlayer&&flash>0&&frame%6<3)return;if(!isPlayer){rogue(x,y,face,flash,walking);return}ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(face,1);let c='#202539',red='#c9233c',step=walking?Math.round(Math.sin(frame*.22)*2):0;
// Scabbards and bright steel blades on the ninja's back and hips.
poly([[-8,-34],[-5,-38],[19,-64],[22,-61],[0,-31]],'#292333');poly([[17,-63],[21,-68],[25,-65],[21,-59]],'#b9c2d0');poly([[5,-22],[9,-25],[34,-12],[32,-8]],'#302739');poly([[32,-12],[38,-10],[35,-6]],'#c4c8d0');
// Boots and sharply layered trousers.
poly([[-11,-16],[-4,-14],[-5,-5+step],[-8,-2+step],[-18,-2+step],[-18,-5+step],[-11,-7+step]],'#171a2a');poly([[2,-14],[10,-16],[13,-7-step],[18,-4-step],[18,-1-step],[5,-1-step],[2,-5-step]],'#171a2a');rect(-17,-2+step,15,3,'#111522');rect(5,-2-step,15,3,'#111522');poly([[-12,-29],[0,-28],[11,-30],[10,-15],[3,-12],[-10,-15]],c);poly([[-9,-24],[-2,-22],[-6,-14],[-12,-15]],'#30364a');poly([[3,-23],[10,-25],[11,-17],[6,-14]],'#30364a');
// Broad shadowed tunic, shoulders, and red waist sash.
poly([[-8,-43],[-14,-39],[-12,-29],[-9,-22],[0,-20],[10,-23],[13,-31],[11,-39],[6,-44]],c);poly([[-13,-39],[-18,-37],[-17,-29],[-12,-27],[-9,-31]],'#292f43');poly([[9,-39],[15,-38],[17,-30],[12,-27],[9,-31]],'#292f43');rect(-13,-37,4,7,'#74717e');rect(11,-37,4,7,'#74717e');rect(-14,-31,4,2,'#c3474f');poly([[-10,-27],[-4,-26],[4,-27],[10,-25],[8,-22],[-2,-23],[-10,-22]],red);poly([[-8,-25],[-3,-23],[-7,-19],[-10,-20]],'#ef3549');poly([[1,-24],[5,-25],[8,-20],[5,-18],[2,-21]],'#ef3549');rect(-3,-27,6,3,'#f04a53');
// Hood, face wrap, eyes, and the unmistakable red headband tails.
poly([[-11,-43],[-12,-50],[-9,-55],[-4,-58],[5,-58],[11,-54],[12,-46],[9,-41],[5,-39],[-7,-40]],c);poly([[-13,-49],[-10,-54],[-5,-57],[3,-58],[8,-55],[11,-51],[7,-48],[-5,-49]],'#30364b');poly([[-10,-47],[-5,-49],[6,-48],[10,-45],[7,-40],[1,-38],[-7,-41]],'#ba8b7d');poly([[-11,-46],[-5,-48],[3,-47],[8,-44],[5,-41],[-5,-42]],'#1a1c2b');rect(-5,-46,5,2,'#f3e2c8');rect(3,-46,4,2,'#f3e2c8');poly([[-10,-42],[-4,-40],[4,-39],[10,-42],[8,-36],[1,-33],[-6,-35]],'#c9233c');poly([[-8,-39],[-2,-36],[5,-37],[9,-40],[6,-36],[-1,-34]],'#f04450');poly([[-10,-50],[-3,-49],[2,-47],[-5,-47]],'#c9233c');poly([[7,-50],[13,-49],[19,-53],[23,-51],[20,-46],[14,-47],[10,-45]],red);poly([[12,-47],[20,-45],[27,-40],[24,-37],[17,-41],[12,-42]],'#e33148');poly([[8,-50],[12,-52],[22,-57],[24,-54],[17,-49]],'#831d36');
// Hands and weapon in the lead hand; attack poses extend it forward.
poly([[11,-36],[16,-35],[18,-29],[15,-27],[11,-30]],c);softRect(13,-30,5,4,'#c99a88',2);if(isPlayer&&attackTime>0){if(kind==='punch'){poly([[12,-37],[23,-36],[29,-33],[28,-30],[20,-31],[14,-32]],c);softRect(26,-34,7,6,'#c99a88',2)}else{poly([[9,-29],[15,-31],[24,-25],[22,-22],[13,-24]],c);poly([[19,-26],[31,-19],[29,-17],[18,-22]],'#777f91');poly([[28,-20],[34,-18],[31,-17]],'#d4d7df')}}else{poly([[11,-37],[15,-36],[18,-31],[14,-29],[11,-32]],c);rect(12,-31,6,3,'#c99a88')}ctx.restore()}
function rogue(x,y,face,flash,walking){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(face,1);let step=walking?Math.round(Math.sin(frame*.22)*2):0,cloak=flash?'#f7e2ce':'#48586a';
// Loose dark trousers and long boots.
poly([[-11,-18],[10,-18],[11,-7-step],[13,0-step],[7,0-step],[4,-7-step],[0,-11],[-4,-7+step],[-5,0+step],[-12,0+step],[-10,-7+step]],'#202e3c');rect(-14,-2+step,10,3,'#17232e');rect(6,-2-step,10,3,'#17232e');
// Exposed forearms, fingerless gloves and twin blades.
poly([[-15,-39],[-19,-28],[-18,-23],[-15,-23],[-13,-33],[-11,-36]],'#c9aa99');poly([[12,-39],[16,-36],[19,-27],[18,-23],[15,-24],[11,-33]],'#c9aa99');rect(-19,-25,5,6,'#263342');rect(15,-25,5,6,'#263342');rect(-20,-20,6,4,'#c4a190');rect(15,-20,6,4,'#c4a190');poly([[-20,-20],[-23,-18],[-30,-7],[-29,-4],[-27,-6],[-19,-17]],'#839bad');poly([[19,-20],[22,-20],[31,-7],[37,-5],[36,-3],[29,-4],[19,-16]],'#b8efff');poly([[20,-19],[22,-19],[31,-7],[35,-6],[31,-6]],'#4da7c9');rect(-23,-22,5,4,'#b82e43');rect(19,-23,5,4,'#b82e43');
// Ragged gray mantle and wrapped belt.
poly([[-10,-46],[-17,-43],[-21,-35],[-16,-36],[-13,-24],[-9,-27],[-6,-20],[-2,-25],[2,-20],[6,-26],[10,-23],[13,-35],[21,-33],[16,-41],[9,-46]],cloak);poly([[-11,-43],[-16,-38],[-13,-29],[-9,-32],[-6,-25],[-5,-39]],flash?'#fff1db':'#617184');poly([[3,-42],[10,-43],[15,-36],[11,-36],[9,-28],[5,-31]],flash?'#fff1db':'#394b5e');poly([[-11,-22],[9,-26],[10,-22],[-10,-17]],'#222d3a');poly([[-10,-20],[10,-24],[10,-22],[-10,-18]],'#796675');
// Deep hood, pale face and blue glinting eyes.
poly([[-11,-43],[-12,-49],[-10,-55],[-6,-60],[0,-63],[5,-61],[11,-55],[12,-47],[9,-42],[3,-39],[-6,-40]],cloak);poly([[-9,-48],[-8,-54],[-3,-57],[4,-56],[9,-52],[9,-46],[5,-42],[-3,-41],[-8,-44]],'#1d2b39');poly([[-5,-49],[1,-51],[6,-48],[7,-44],[3,-41],[-2,-42],[-5,-45]],'#dfb8a7');rect(-5,-49,4,2,'#b4e5ff');rect(2,-49,3,2,'#f2f6f1');rect(-1,-44,5,2,'#685d66');poly([[4,-61],[9,-60],[13,-56],[8,-57]],'#303f50');ctx.restore()}
function draw(){let cold=stageIndex===2,hot=stageIndex===3;rect(0,0,W,H,cold?'#111b38':hot?'#291329':'#17122e');rect(0,75,W,205,cold?'#273657':hot?'#552434':'#302044');for(let i=0;i<55;i++){let x=(i*113)%640,y=(i*59)%150;rect(x,y,i%7===0?3:2,2,cold?'#d5eaff':hot?'#ffb26e':i%3?'#b9a5c4':'#f9d5a1')}poly([[0,252],[85,142],[155,235],[244,122],[335,235],[410,155],[505,238],[570,148],[640,218],[640,280],[0,280]],cold?'#283954':hot?'#52263a':'#28213c');if(stageIndex===0){temple(66,190,1);temple(330,223,.55)}else if(stageIndex===1){for(let x=60;x<640;x+=135){rect(x,100,12,180,'#293b38');rect(x-15,130,43,8,'#416044');rect(x-24,100,60,8,'#344d41')}}else if(cold){for(let x=35;x<640;x+=145){rect(x,180,95,100,'#59647d');rect(x+8,165,80,16,'#a5bdd0');rect(x+20,195,13,28,'#f9e9bf')}}else{for(let x=40;x<640;x+=145){poly([[x,280],[x+45,130],[x+90,280]],'#582a38');rect(x+39,179,12,25,'#ff9f55')}}rect(0,280,640,80,cold?'#34415b':hot?'#542b37':'#39283a');rect(0,280,640,6,cold?'#a7c5d8':hot?'#ff9b58':'#b76558');for(const [x,r] of hazards){poly([[x,280],[x+7,264],[x+15,280]],hot?'#ff713f':cold?'#a8ddf2':'#e65a49');poly([[x+13,280],[x+25,259],[x+38,280]],hot?'#ff9c42':cold?'#e8f7ff':'#ff9b54');poly([[x+34,280],[x+44,265],[x+54,280]],hot?'#ff713f':cold?'#a8ddf2':'#e65a49');rect(x,280,r-x,5,hot?'#e83b38':cold?'#b6e9ff':'#d34753')}for(const [x,y,w] of platforms){rect(x,y,w,10,cold?'#9ab0be':hot?'#b95d53':'#765066');rect(x+5,y+10,w-10,4,cold?'#536a7a':hot?'#713b48':'#493149');rect(x+12,y+3,Math.max(10,w-24),2,cold?'#e1f2f5':hot?'#ffd073':'#cf8c75')}if(doorOpen){softRect(570,232,45,48,'#ffc76a',6);softRect(575,237,35,43,'#33233b',5);softRect(580,242,25,38,'#523551',4);softRect(597,257,4,4,'#ffe394',2);rect(566,228,53,5,'#ffe394');ctx.fillStyle='#ffe394';ctx.font='bold 9px monospace';ctx.fillText('EXIT',578,224)}enemies.forEach(e=>{if(!e.dead&&e.delay<=0){if(e.windup>0){rect(e.x-3,e.y-83,6,9,'#ffca58');rect(e.x-3,e.y-72,6,3,'#ffca58')}ninja(e.x,e.y,'#9b4965',e.x<player.x?1:-1,false,e.flash,true,'',0);rect(e.x-14,e.y-70,28,4,'#2e1729');rect(e.x-14,e.y-70,28*e.hp/e.maxHp,4,'#ed6962')}});ninja(player.x,player.y,'#328ac0',player.face,true,player.inv,player.move,player.kind,player.attack);stars.forEach(s=>{rect(s.x-4,s.y-1,9,3,'#fff0a4');rect(s.x-1,s.y-4,3,9,'#fff0a4')});particles.forEach(p=>rect(p.x,p.y,3,3,p.color));ctx.fillStyle='#fff0cb';ctx.font='bold 12px monospace';ctx.fillText(`STAGE ${String(stageIndex+1).padStart(2,'0')} - ${stages[stageIndex].name}`,12,20);ctx.fillStyle='#ffdb91';ctx.fillText('ENEMIES '+(stages[stageIndex].count-stageKills),530,20)}
function loop(){if(active)update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),code=e.code;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a'||code==='KeyA')keys.left=true;if(k==='arrowright'||k==='d'||code==='KeyD')keys.right=true;if(!e.repeat){if(k===' '||k==='arrowup'||k==='w'||code==='Space'||code==='KeyW')jump();if(k==='arrowdown'||k==='s'||code==='KeyS')enterDoor();if(k==='j'||code==='KeyJ')attack('punch');if(k==='l'||code==='KeyL')attack('kick');if(k==='k'||code==='KeyK')star()}});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase(),code=e.code;if(k==='arrowleft'||k==='a'||code==='KeyA')keys.left=false;if(k==='arrowright'||k==='d'||code==='KeyD')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false});
for(const direction of ['left','right']){let button=document.getElementById(direction);button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys[direction]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>keys[direction]=false)}
document.getElementById('door').onclick=enterDoor;document.getElementById('jump').onclick=jump;document.getElementById('punch').onclick=()=>attack('punch');document.getElementById('kick').onclick=()=>attack('kick');document.getElementById('star').onclick=star;document.getElementById('restart').onclick=reset;document.getElementById('music').onclick=toggleMusic;
reset();requestAnimationFrame(loop);
</script>
</body>
